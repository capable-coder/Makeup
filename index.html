<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leena VIP Store V3</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-color: #050508;
            --primary: #ff2a5f;
            --secondary: #00f0ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .blob-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.4;
            z-index: -1;
            animation: float 10s ease-in-out infinite alternate;
        }

        .blob-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: var(--secondary);
            filter: blur(120px);
            opacity: 0.3;
            z-index: -1;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px 25px;
            margin-top: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .plans-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .plan-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 18px 22px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .plan-card.active {
            border-color: var(--primary);
            background: rgba(255, 42, 95, 0.08);
            box-shadow: 0 10px 25px rgba(255, 42, 95, 0.15);
        }

        .plan-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
        }

        .plan-details h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .plan-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .plan-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .popular-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: linear-gradient(135deg, var(--primary), #ff758c);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            border-bottom-left-radius: 12px;
            text-transform: uppercase;
        }

        .total-due {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px 10px 0;
            border-top: 1px solid var(--glass-border);
        }

        .total-due span {
            color: var(--text-muted);
            font-size: 15px;
        }

        .total-due strong {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pay-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #c81d77);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 42, 95, 0.4);
            text-transform: uppercase;
        }

        .qr-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .instructions {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .instructions strong {
            color: var(--text-main);
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .instructions ol {
            padding-left: 20px;
        }

        #qr-section {
            display: none;
            margin-top: 25px;
            text-align: center;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        #qr-section p {
            color: #050508;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="container">
        <div class="header">
            <h1 id="page-title">VIP Access</h1>
            <p id="page-subtitle">Upgrade your experience</p>
        </div>

        <div class="input-group">
            <label>Telegram User ID</label>
            <input type="number" id="userid" placeholder="Enter your Telegram ID" required>
        </div>

        <div class="input-group">
            <label>Select Package</label>
            <div class="plans-wrapper" id="plans-container">
                <!-- Injected via JS -->
            </div>
        </div>

        <div class="total-due">
            <span id="selected-plan-text">Total due</span>
            <strong id="total-amount">₹0</strong>
        </div>

        <div class="btn-group">
            <button class="pay-btn" onclick="payNow()">Proceed to Pay ➔</button>
            <button class="qr-btn" onclick="showQR()">Scan QR Code Instead</button>
        </div>

        <div id="qr-section">
            <div id="qrcode"></div>
            <p>Scan using PhonePe / GPay</p>
        </div>

        <div class="instructions" id="instructions-container">
            <!-- Injected via JS -->
        </div>
    </div>

    <script>
        let amount = 0;
        let planName = "";
        let currentType = "premium";
        
        let upi_id = "BHARATPE2H0H0Q2W7F87590@unitype"; 
        let payee_name = "Leena VIP";   

        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); 

        const urlParams = new URLSearchParams(window.location.search);
        let tg_uid = urlParams.get('uid') || (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user ? Telegram.WebApp.initDataUnsafe.user.id : "");
        currentType = urlParams.get('type') || "premium"; 
        
        document.getElementById('userid').value = tg_uid;

        function renderUI() {
            const titleEl = document.getElementById('page-title');
            const subEl = document.getElementById('page-subtitle');
            const plansContainer = document.getElementById('plans-container');
            const instructionsContainer = document.getElementById('instructions-container');

            if (currentType === "topup") {
                titleEl.innerHTML = "Leena Treasury";
                subEl.innerHTML = "Top-Up your Leena Money";
                
                plansContainer.innerHTML = `
                    <div class="plan-card active" onclick="selectPlan(50, '500K Money', this)">
                        <div class="plan-details">
                            <h3>500,000 Money</h3>
                            <p>Starter Pack</p>
                        </div>
                        <div class="plan-price">₹50</div>
                    </div>
                    <div class="plan-card" onclick="selectPlan(100, '1M Money', this)">
                        <div class="popular-badge">Popular</div>
                        <div class="plan-details">
                            <h3>1,000,000 Money</h3>
                            <p>Millionaire Pack (1M)</p>
                        </div>
                        <div class="plan-price">₹100</div>
                    </div>
                    <div class="plan-card" onclick="selectPlan(500, '5M Money', this)">
                        <div class="popular-badge">King Level</div>
                        <div class="plan-details">
                            <h3>5,000,000 Money</h3>
                            <p>Ultimate Dominator (5M)</p>
                        </div>
                        <div class="plan-price">₹500</div>
                    </div>
                `;

                instructionsContainer.innerHTML = `
                    <strong>How to Top-Up:</strong>
                    <ol>
                        <li>Select a package and tap Proceed.</li>
                        <li>If UPI app doesn't open, tap "Scan QR Code" and use PhonePe/GPay to scan the screenshot.</li>
                        <li><strong>Send the payment screenshot (SS) to the Owner (@II_ADI_II) for instant credit!</strong></li>
                    </ol>
                `;
                
                amount = 50;
                planName = "500K Money";

            } else {
                titleEl.innerHTML = "Leena Premium";
                subEl.innerHTML = "Unlock exclusive bot features";
                
                plansContainer.innerHTML = `
                    <div class="plan-card active" onclick="selectPlan(39, '1 Week', this)">
                        <div class="plan-details">
                            <h3>1 Week</h3>
                            <p>7 Days VIP Access</p>
                        </div>
                        <div class="plan-price">₹39</div>
                    </div>
                    <div class="plan-card" onclick="selectPlan(49, '1 Month', this)">
                        <div class="popular-badge">Best Value</div>
                        <div class="plan-details">
                            <h3>1 Month</h3>
                            <p>30 Days VIP Access</p>
                        </div>
                        <div class="plan-price">₹49</div>
                    </div>
                    <div class="plan-card" onclick="selectPlan(79, '2 Months', this)">
                        <div class="plan-details">
                            <h3>2 Months</h3>
                            <p>60 Days VIP Access</p>
                        </div>
                        <div class="plan-price">₹79</div>
                    </div>
                `;

                instructionsContainer.innerHTML = `
                    <strong>Premium Activation:</strong>
                    <ol>
                        <li>Tap Proceed to Pay via your UPI app.</li>
                        <li>If it fails, use the QR Code method.</li>
                        <li>Send the successful payment screenshot to the Admin to activate your Premium tag.</li>
                    </ol>
                `;

                amount = 39;
                planName = "1 Week";
            }

            document.getElementById('selected-plan-text').innerText = `Total due (${planName})`;
            document.getElementById('total-amount').innerText = `₹${amount}`;
        }

        function selectPlan(amt, name, element) {
            amount = amt;
            planName = name;
            
            document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('selected-plan-text').innerText = `Total due (${name})`;
            document.getElementById('total-amount').innerText = `₹${amt}`;
            
            document.getElementById('qr-section').style.display = 'none';
        }

        function getUpiLink() {
            let uid = document.getElementById('userid').value || "NoID";
            let cleanPlanName = planName.replace(/\s+/g, '');
            let ref_id = `LEENA-${currentType.toUpperCase()}-${cleanPlanName}-${uid}`;
            return `upi://pay?pa=${upi_id}&pn=${encodeURIComponent(payee_name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(ref_id)}`;
        }

        function payNow() {
            let uid = document.getElementById('userid').value;
            if(!uid) {
                Telegram.WebApp.showAlert("⚠️ Please enter your Telegram User ID!");
                return;
            }

            let btn = document.querySelector('.pay-btn');
            let originalText = btn.innerHTML;
            btn.innerHTML = "Opening UPI App... ⏳";
            
            let upi_link = getUpiLink();

            if (Telegram.WebApp.isVersionAtLeast("6.1")) {
                Telegram.WebApp.openLink(upi_link);
            } else {
                let a = document.createElement('a');
                a.href = upi_link;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 3000);
        }

        function showQR() {
            let uid = document.getElementById('userid').value;
            if(!uid) {
                Telegram.WebApp.showAlert("⚠️ Please enter your Telegram User ID first!");
                return;
            }

            let qrSection = document.getElementById('qr-section');
            let qrContainer = document.getElementById('qrcode');
            
            qrContainer.innerHTML = "";
            
            new QRCode(qrContainer, {
                text: getUpiLink(),
                width: 180,
                height: 180,
                colorDark : "#050508",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            qrSection.style.display = 'block';
            qrSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize UI
        renderUI();
    </script>

</body>
</html>
